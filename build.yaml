---
include:
  - board: rp2040_zero//zmk
    shield: yr32lp
    snippet: studio-rpc-usb-uart
    artifact-name: yr32lp_rp2040_zero
  # トラックボール調整用(生カウントを USB シリアルに出す。ZMK Studio は使えない)
  - board: rp2040_zero//zmk
    shield: yr32lp
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_INPUT_PIM447_LOG_RAW=y -DCONFIG_ZMK_LOG_LEVEL_WRN=y -DCONFIG_LOG_BUFFER_SIZE=16384 -DCONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096 -DCONFIG_LOG_PROCESS_THREAD_SLEEP_MS=20
    artifact-name: yr32lp_rp2040_zero_trackball_log
