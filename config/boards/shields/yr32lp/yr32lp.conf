# yr32lp (Waveshare RP2040-Zero, USB 有線)

# トラックボール (PIM447) / マウスキー
CONFIG_ZMK_POINTING=y

# WS2812 x30 (QMK の max_brightness 125/255 ≒ 50%)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=50
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
# 外部電源制御の回路は無いので使わない
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# LED の ON/OFF・効果・明るさを電源を切っても覚えておく
CONFIG_SETTINGS=y

# ZMK Studio (USB): キーマップエディターの「USB接続」でキーを書き換える
# (build.yaml の snippet: studio-rpc-usb-uart とセット。ロック解除キーは使わない)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# USB 表示名
CONFIG_USB_DEVICE_PRODUCT="yr32lp"
CONFIG_USB_DEVICE_MANUFACTURER="YRLYG1019"
